name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write      # lets the push run commit Ruff's fixes back to the branch

jobs:
  quality-and-tests:
    runs-on: ubuntu-24.04   # pinned, so the build environment only changes on purpose
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint and format (ruff)
        # Pull requests must arrive clean. On pushes, Ruff sorts imports and formats the code itself, and any change is
        # committed back by github-actions[bot] before the remaining checks run on the formatted code.
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            ruff check --fix .
            ruff format .
            if ! git diff --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit --all --quiet --message "Apply Ruff formatting [skip ci]"
              git push || echo "::warning::Could not push the formatting commit; the next push will format again."
            fi
          fi
          ruff check .
          ruff format --check .

      - name: Type check (typed core modules, listed in pyproject.toml)
        run: mypy

      - name: Unit and app tests
        run: pytest --cov --cov-report=term-missing

      - name: App smoke test (server starts and reports healthy)
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8599 &
          for i in $(seq 1 30); do
            curl --fail --silent http://localhost:8599/_stcore/health && exit 0
            sleep 2
          done
          echo "Streamlit did not become healthy" && exit 1
