[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foodvision-lab"
version = "1.0.0"
description = "Explainable transfer learning for food image classification: EfficientNet benchmarking, statistics, calibration, Grad-CAM and a Streamlit app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anush Goel" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
app = ["streamlit>=1.40,<2", "plotly>=5.20,<7"]
train = ["tensorboard>=2.15"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.6.9", "mypy>=1.10", "types-PyYAML", "pre-commit>=3.7"]

[project.scripts]
foodvision-pipeline = "foodvision.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905", "UP038"]

[tool.ruff.lint.isort]
known-first-party = ["foodvision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["foodvision"]
omit = ["*/pipeline.py"]          # GPU orchestration; exercised by the Colab run, not by CI

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
